<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URJAFLUX AI OS</title>
    <script>
      (function() {
        // Suppress browser extension / web3 wallet injection errors (e.g., "Cannot redefine property: ethereum")
        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || (event && event.error) || '').toLowerCase();
          if (
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('redefine property') !== -1 ||
            msg.indexOf('chrome-extension') !== -1 ||
            msg.indexOf('inpage') !== -1 ||
            msg.indexOf('metamask') !== -1 ||
            msg.indexOf('rabby') !== -1 ||
            msg.indexOf('phantom') !== -1 ||
            msg.indexOf('wallet') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = String((event && event.reason && event.reason.message) || (event && event.reason) || '').toLowerCase();
          if (
            reason.indexOf('ethereum') !== -1 ||
            reason.indexOf('redefine property') !== -1 ||
            reason.indexOf('chrome-extension') !== -1 ||
            reason.indexOf('inpage') !== -1 ||
            reason.indexOf('metamask') !== -1 ||
            reason.indexOf('rabby') !== -1 ||
            reason.indexOf('phantom') !== -1 ||
            reason.indexOf('wallet') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Safely wrap Object.defineProperty to ignore property redefinition collisions on window.ethereum
        var origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === window && prop === 'ethereum') {
            try {
              return origDefineProperty.call(this, obj, prop, descriptor);
            } catch (err) {
              console.warn('[URJAFLUX AI OS] Suppressed wallet extension property redefinition conflict on window.ethereum:', err);
              return obj;
            }
          }
          return origDefineProperty.apply(this, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
